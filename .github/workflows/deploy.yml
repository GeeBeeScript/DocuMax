# Deploy on main (docs/RUNBOOKS.md → Deploy). The web app deploys through Vercel's Git integration; this workflow
# applies database migrations and publishes the worker image. Steps whose secrets aren't configured are skipped.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  migrations:
    name: Apply database migrations
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - if: env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_REF == ''
        run: echo "::warning::Supabase secrets not set — skipping migrations."
      - if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: |
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          npx supabase db push --password "$SUPABASE_DB_PASSWORD"

  worker-image:
    name: Build + publish the worker image (GHCR)
    runs-on: ubuntu-latest
    needs: migrations
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/documax-worker:latest
            ghcr.io/${{ github.repository_owner }}/documax-worker:${{ github.sha }}
      - name: Roll the worker (Railway/Fly deploy hook, if configured)
        env:
          WORKER_DEPLOY_HOOK: ${{ secrets.WORKER_DEPLOY_HOOK }}
        if: env.WORKER_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$WORKER_DEPLOY_HOOK"
